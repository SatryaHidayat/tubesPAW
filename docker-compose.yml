version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafe-app
    container_name: cafe-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - cafe-network

  db:
    image: mysql:8.0
    container_name: cafe-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cafe_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "33061:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - cafe-network

  webserver:
    image: nginx:alpine
    container_name: cafe-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cafe-network

networks:
  cafe-network:
    driver: bridge

volumes:
  dbdata:
    driver: local